name: Publish and verify Lean 4.35 compatibility port

"on":
  push:
    branches: [publish-kakeya-lean435]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'mrklwk/kakeya-sharp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.publish.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Publish exact mathematical rendering
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4debd63b173fe4aba9f30e474c36328ef1b8cc04
          python3 - <<'PY'
          from pathlib import Path
          names = ["README.md", "ABSTRACT.md", "SUMMARY.md", "STATEMENT_AND_OPTIMALITY.md", "INFORMAL.md", "review/claude/REQUEST.md"]
          for name in names:
              p = Path(name)
              inside = False
              out = []
              for line in p.read_text().splitlines(keepends=True):
                  if line.rstrip("\r\n") == "$$":
                      out.append(("```math" if not inside else "```") + "\n")
                      inside = not inside
                  else:
                      out.append(line)
              assert not inside, name
              p.write_text("".join(out))
          PY
          python3 scripts/package_source.py --output "$RUNNER_TEMP/kakeya-source.zip"
          git add -- README.md ABSTRACT.md SUMMARY.md STATEMENT_AND_OPTIMALITY.md INFORMAL.md review/claude/REQUEST.md SOURCE_SHA256.json
          test "$(git write-tree)" = aa8edd4ee0f9093290118bc8aa30c9dfc4f9e0af
          git diff --cached --exit-code -- .github/workflows
          git config user.name "Mark Lewko"
          git config user.email "244564904+mrklwk@users.noreply.github.com"
          git commit -m "Preserve mathematical escapes in GitHub display blocks" -m "Source tree matches local candidate 542d24cf77dd8f46ca9aab15bc11c602104f9c97 exactly."
          git push origin HEAD:refs/heads/main
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

  verify:
    needs: publish
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ needs.publish.outputs.source_commit }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: kakeyacheck4
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}

